<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tarot By Tichele</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">

<style>

/* =========================
   GLOBAL STYLES
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: 'Cormorant Garamond', serif;
    background: linear-gradient(
        to bottom,
        #4d2e83 0%,
        #6b54b4 50%,
        #7c67c5 100%
    );
    color:#ffffff;
    text-align:center;
    line-height:1.6;
    padding:40px 20px;
}

/* =========================
   HEADER
========================= */

.site-title{
    font-family: 'Cinzel', serif;
    font-size:2.8rem;
    font-weight:400;
    margin-bottom:30px;
    letter-spacing:1px;
}

/* =========================
   SERVICES
========================= */

.services{
    font-size:1.6rem;
    margin-bottom:50px;
}

.services p{
    margin:12px 0;
}

/* =========================
   DIVIDER
========================= */

.divider{
    width:80%;
    height:6px;
    margin:40px auto;
    border-radius:10px;

    background:#7be3cf;

    box-shadow:
        0 0 10px #7be3cf,
        0 0 25px #7be3cf,
        0 0 40px #7be3cf;
}

/* =========================
   READER SECTION
========================= */

.reader-title{
    font-family:'Cinzel', serif;
    font-size:2rem;
    margin-bottom:40px;
}

/* =========================
   PROFILE IMAGE
========================= */

.reader-image-wrapper{
    display:flex;
    justify-content:center;
    align-items:center;
}

.reader-image{

    width:260px;
    height:260px;

    border-radius:50%;
    object-fit:cover;

    border:10px solid #7be3cf;

    box-shadow:
        0 0 25px rgba(123,227,207,0.8),
        0 0 60px rgba(123,227,207,0.6),
        0 0 100px rgba(123,227,207,0.5);
}

/* =========================
   MOBILE OPTIMIZATION
========================= */

@media (max-width:600px){

    .site-title{
        font-size:2.3rem;
    }

    .services{
        font-size:1.4rem;
    }

    .reader-title{
        font-size:1.7rem;
    }

    .reader-image{
        width:220px;
        height:220px;
    }

}

</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<h1 class="site-title">Tarot By Tichele</h1>


<!-- =========================
     SERVICES
========================= -->

<section class="services">

<p>✨ Tarot Reading ✨</p>

<p>✨ Protection Jars ✨</p>

<p>✨ Natural Art ✨</p>

<p>✨ Home Cleansing / Blessing ✨</p>

<p>✨ Intention Candles ✨</p>

<p>✨ Intention Satchets ✨</p>

</section>


<!-- =========================
     DIVIDER
========================= -->

<div class="divider"></div>


<!-- =========================
     MEET YOUR READER
========================= -->

<section>

<h2 class="reader-title">Meet Your Reader</h2>

<div class="reader-image-wrapper">

<img
class="reader-image"
src="reader.jpg"
alt="Tarot Reader">

</div>

</section>


</body>
</html>
